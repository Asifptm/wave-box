<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavebox — YouTube Music API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --bg-deep: #0a0e17;
      --accent: #00e5c7;
      --accent-dim: #00b39a;
      --text: #f0f4f8;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --player-h: 0px;
      --player-bar: 118px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: var(--bg-deep);
      overflow-x: hidden;
      padding-bottom: calc(var(--player-h) + 1.5rem);
    }

    body.player-open { --player-h: var(--player-bar); }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 229, 199, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(99, 102, 241, 0.2), transparent),
        radial-gradient(ellipse 50% 30% at 0% 80%, rgba(236, 72, 153, 0.15), transparent),
        linear-gradient(180deg, #0f172a 0%, #0a0e17 50%, #050810 100%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 2rem;
    }

    .hero { text-align: center; margin-bottom: 2rem; }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      margin-bottom: 1rem;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(0, 229, 199, 0.15), rgba(99, 102, 241, 0.12));
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 48px rgba(0, 229, 199, 0.12);
    }

    .logo-wrap svg { width: 52px; height: 52px; }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .alert {
      display: none;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fecaca;
      font-size: 0.9rem;
      text-align: left;
    }

    .alert.visible { display: flex; }

    .alert i { margin-top: 0.15rem; flex-shrink: 0; }

    .alert-close {
      margin-left: auto;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      opacity: 0.8;
      padding: 0.15rem;
    }

    .search-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.25rem;
      backdrop-filter: blur(8px);
      margin-bottom: 1.25rem;
    }

    .search-panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-panel h2 i { color: var(--accent); }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .search-field {
      flex: 1 1 200px;
      position: relative;
    }

    .search-field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }

    .search-field input:focus {
      outline: none;
      border-color: rgba(0, 229, 199, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 229, 199, 0.12);
    }

    .search-field input::placeholder { color: var(--muted); }

    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 10;
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      max-height: 220px;
      overflow-y: auto;
    }

    .suggestions.visible { display: block; }

    .suggestions button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.6rem 1rem;
      border: none;
      background: none;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .suggestions button:hover { background: rgba(255, 255, 255, 0.06); }

    select {
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.75rem 1.15rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #042f2e;
    }

    .btn-primary:not(:disabled):hover { transform: translateY(-1px); }

    .status-line {
      min-height: 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: left;
    }

    .status-line.loading { color: var(--accent); }

    .results {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .results-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.95rem;
      border: 1px dashed var(--card-border);
      border-radius: 16px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--card-border);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
      font: inherit;
      color: inherit;
    }

    .track:hover,
    .track.active {
      border-color: rgba(0, 229, 199, 0.45);
      background: rgba(0, 229, 199, 0.06);
    }

    .track img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .track-thumb-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      flex-shrink: 0;
    }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .track-play {
      color: var(--accent);
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .player-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      background: rgba(10, 14, 23, 0.97);
      border-top: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      padding: 0.85rem 1rem;
    }

    .player-dock.open { transform: translateY(0); }

    .player-layout {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      max-width: 820px;
      margin: 0 auto;
      text-align: left;
    }

    .player-art {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-art-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      flex-shrink: 0;
    }

    .player-main { flex: 1; min-width: 0; }

    .player-main strong {
      display: block;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-main span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.45rem;
    }

    .progress {
      position: relative;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      touch-action: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress input[type="range"] {
      position: absolute;
      inset: -6px 0;
      width: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.25rem;
      font-variant-numeric: tabular-nums;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .ctrl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s, transform 0.15s;
    }

    .ctrl:disabled { opacity: 0.35; cursor: not-allowed; }

    .ctrl:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); }

    .ctrl-play {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #042f2e;
      border: none;
    }

    .ctrl-play:not(:disabled):hover { transform: scale(1.04); }

    .volume-wrap {
      display: none;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .volume-wrap { display: flex; }
    }

    .volume-wrap i { color: var(--muted); font-size: 0.85rem; }

    .volume-wrap input[type="range"] {
      width: 72px;
      accent-color: var(--accent);
    }

    .yt-host {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .player-error {
      display: none;
      max-width: 820px;
      margin: 0.45rem auto 0;
      font-size: 0.78rem;
      color: #fecaca;
      text-align: left;
    }

    .player-error.visible { display: block; }

    .player-error a { color: var(--accent); }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <div class="logo-wrap" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wavebox logo">
          <rect x="8" y="14" width="48" height="36" rx="8" stroke="#00e5c7" stroke-width="2.5" fill="rgba(0,229,199,0.08)"/>
          <path d="M14 38c6-8 12-8 18 0s12 8 18 0" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="26" r="4" fill="#00e5c7"/>
          <path d="M28 8h8l2 6H26l2-6z" fill="#00e5c7" opacity="0.9"/>
        </svg>
      </div>
      <h1><span>Wavebox</span></h1>
      <p class="tagline">Search YouTube Music and play tracks from your API.</p>
    </header>

    <div id="alert" class="alert" role="alert" aria-live="polite">
      <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
      <span id="alert-text"></span>
      <button type="button" class="alert-close" id="alert-close" aria-label="Dismiss">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading"><i class="fa-solid fa-magnifying-glass"></i> Search music</h2>
      <form id="search-form" class="search-row">
        <div class="search-field">
          <input
            id="query"
            name="q"
            type="search"
            autocomplete="off"
            placeholder="Song, artist, or album…"
            required
            minlength="1"
          />
          <div id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions"></div>
        </div>
        <select id="type" name="type" aria-label="Result type">
          <option value="song" selected>Songs</option>
          <option value="album">Albums</option>
          <option value="artist">Artists</option>
          <option value="playlist">Playlists</option>
        </select>
        <button type="submit" class="btn btn-primary" id="search-btn">
          <i class="fa-solid fa-search"></i> Search
        </button>
      </form>
      <p id="status" class="status-line"></p>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <footer>
      API docs at <a href="/api">/api</a>
    </footer>
  </main>

  <div id="yt-player-host" class="yt-host" aria-hidden="true"></div>

  <aside id="player-dock" class="player-dock" aria-label="Now playing">
    <div class="player-layout">
      <img id="player-thumb" class="player-art" src="" alt="" hidden />
      <div id="player-art-placeholder" class="player-art-placeholder" hidden>
        <i class="fa-solid fa-music"></i>
      </div>
      <div class="player-main">
        <strong id="player-title">—</strong>
        <span id="player-artist">Select a track to play</span>
        <div class="progress" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <input type="range" id="progress-seek" min="0" max="100" value="0" aria-label="Seek" />
        </div>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <button type="button" class="ctrl" id="btn-prev" title="Previous" aria-label="Previous track" disabled>
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button type="button" class="ctrl ctrl-play" id="btn-play" title="Play" aria-label="Play" disabled>
          <i class="fa-solid fa-play" id="icon-play"></i>
        </button>
        <button type="button" class="ctrl" id="btn-next" title="Next" aria-label="Next track" disabled>
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button type="button" class="ctrl" id="player-close" title="Close" aria-label="Close player">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="volume-wrap">
        <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
        <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume" />
      </div>
    </div>
    <p id="player-error" class="player-error"></p>
  </aside>

  <script>
    (function () {
      const API = {
        search(q, type) {
          const params = new URLSearchParams({ q, type });
          return fetchJson("/api/search?" + params);
        },
        suggestions(q) {
          const params = new URLSearchParams({ q });
          return fetchJson("/api/suggestions?" + params);
        },
      };

      async function fetchJson(url) {
        let res;
        try {
          res = await fetch(url, { headers: { Accept: "application/json" } });
        } catch {
          throw new Error("Network error. Check your connection and that the API is running.");
        }

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error("Invalid response from server (expected JSON).");
        }

        if (data.status !== 200 || data.response == null) {
          throw new Error(data.message || "Request failed (" + (data.status || res.status) + ").");
        }
        return data.response;
      }

      const el = {
        alert: document.getElementById("alert"),
        alertText: document.getElementById("alert-text"),
        alertClose: document.getElementById("alert-close"),
        form: document.getElementById("search-form"),
        query: document.getElementById("query"),
        type: document.getElementById("type"),
        searchBtn: document.getElementById("search-btn"),
        status: document.getElementById("status"),
        results: document.getElementById("results"),
        suggestions: document.getElementById("suggestions"),
        playerDock: document.getElementById("player-dock"),
        playerTitle: document.getElementById("player-title"),
        playerArtist: document.getElementById("player-artist"),
        playerThumb: document.getElementById("player-thumb"),
        playerArtPlaceholder: document.getElementById("player-art-placeholder"),
        playerError: document.getElementById("player-error"),
        playerClose: document.getElementById("player-close"),
        progressFill: document.getElementById("progress-fill"),
        progressSeek: document.getElementById("progress-seek"),
        timeCurrent: document.getElementById("time-current"),
        timeTotal: document.getElementById("time-total"),
        btnPlay: document.getElementById("btn-play"),
        iconPlay: document.getElementById("icon-play"),
        btnPrev: document.getElementById("btn-prev"),
        btnNext: document.getElementById("btn-next"),
        volume: document.getElementById("volume"),
      };

      let suggestTimer = null;
      let activeTrackKey = null;
      let queue = [];
      let queueIndex = -1;
      let ytPlayer = null;
      let ytReady = false;
      let progressTimer = null;
      let isSeeking = false;
      let currentWatchUrl = "";

      const YT_STATE = { ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };

      function formatTime(seconds) {
        const s = Math.max(0, Math.floor(Number(seconds) || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ":" + r.toString().padStart(2, "0");
      }

      function loadYoutubeApi() {
        if (window.YT && window.YT.Player) return Promise.resolve();
        return new Promise(function (resolve) {
          var done = function () {
            if (window.YT && window.YT.Player) resolve();
          };
          var prev = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = function () {
            if (typeof prev === "function") prev();
            done();
          };
          if (document.querySelector('script[src*="youtube.com/iframe_api"]')) {
            var wait = setInterval(function () {
              if (window.YT && window.YT.Player) {
                clearInterval(wait);
                resolve();
              }
            }, 50);
            return;
          }
          var tag = document.createElement("script");
          tag.src = "https://www.youtube.com/iframe_api";
          document.head.appendChild(tag);
        });
      }

      function ensureYtPlayer() {
        return loadYoutubeApi().then(function () {
          if (ytPlayer) return ytPlayer;
          return new Promise(function (resolve) {
            ytPlayer = new YT.Player("yt-player-host", {
              height: "0",
              width: "0",
              playerVars: {
                controls: 0,
                disablekb: 1,
                fs: 0,
                modestbranding: 1,
                rel: 0,
                iv_load_policy: 3,
                playsinline: 1,
                origin: window.location.origin,
              },
              events: {
                onReady: function (e) {
                  ytReady = true;
                  e.target.setVolume(Number(el.volume.value) || 80);
                  resolve(e.target);
                },
                onStateChange: onPlayerStateChange,
                onError: onPlayerError,
              },
            });
          });
        });
      }

      function setPlayIcon(playing) {
        el.iconPlay.className = playing ? "fa-solid fa-pause" : "fa-solid fa-play";
        el.btnPlay.setAttribute("aria-label", playing ? "Pause" : "Play");
        el.btnPlay.title = playing ? "Pause" : "Play";
      }

      function stopProgressTimer() {
        if (progressTimer) {
          clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function startProgressTimer() {
        stopProgressTimer();
        progressTimer = setInterval(updateProgress, 400);
      }

      function updateProgress() {
        if (!ytPlayer || !ytReady || isSeeking) return;
        var cur = ytPlayer.getCurrentTime();
        var dur = ytPlayer.getDuration();
        if (!dur || !Number.isFinite(dur)) return;
        var pct = Math.min(100, (cur / dur) * 100);
        el.progressFill.style.width = pct + "%";
        el.progressSeek.value = String(pct);
        el.timeCurrent.textContent = formatTime(cur);
        el.timeTotal.textContent = formatTime(dur);
      }

      function onPlayerStateChange(ev) {
        if (ev.data === YT_STATE.PLAYING) {
          setPlayIcon(true);
          startProgressTimer();
          el.playerError.classList.remove("visible");
        } else if (ev.data === YT_STATE.PAUSED) {
          setPlayIcon(false);
          stopProgressTimer();
          updateProgress();
        } else if (ev.data === YT_STATE.ENDED) {
          setPlayIcon(false);
          stopProgressTimer();
          playNext(true);
        } else if (ev.data === YT_STATE.BUFFERING) {
          el.timeCurrent.textContent = "…";
        }
      }

      function youtubeErrorMessage(code) {
        var map = {
          2: "Invalid video request.",
          5: "Playback error in the browser.",
          100: "Video not found or removed.",
          101: "This track cannot be embedded. Open it on YouTube instead.",
          150: "This track cannot be embedded. Open it on YouTube instead.",
        };
        return map[code] || "Playback failed (error " + code + ").";
      }

      function onPlayerError(ev) {
        stopProgressTimer();
        setPlayIcon(false);
        var msg = youtubeErrorMessage(ev.data);
        el.playerError.innerHTML =
          escapeHtml(msg) +
          (currentWatchUrl
            ? ' <a href="' + escapeHtml(currentWatchUrl) + '" target="_blank" rel="noopener noreferrer">Open on YouTube</a>'
            : "");
        el.playerError.classList.add("visible");
        showError(msg);
      }

      function updateQueueButtons() {
        el.btnPrev.disabled = queueIndex <= 0;
        el.btnNext.disabled = queueIndex < 0 || queueIndex >= queue.length - 1;
      }

      function setQueueFromItems(items) {
        queue = items.filter(function (item) {
          return playableItem(item) && item.videoId;
        });
      }

      function highlightQueueTrack(videoId) {
        document.querySelectorAll(".track.active").forEach(function (n) {
          n.classList.remove("active");
        });
        if (!videoId) return;
        document.querySelectorAll(".track").forEach(function (n) {
          if (n.dataset.key === videoId) n.classList.add("active");
        });
      }

      function showError(message) {
        el.alertText.textContent = message;
        el.alert.classList.add("visible");
      }

      function hideError() {
        el.alert.classList.remove("visible");
      }

      function setStatus(text, loading) {
        el.status.textContent = text || "";
        el.status.classList.toggle("loading", !!loading);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function playableItem(item) {
        return item.type === "song" || item.type === "video";
      }

      function renderResults(items, query) {
        el.results.innerHTML = "";
        if (!items.length) {
          el.results.innerHTML =
            '<p class="results-empty">No results for “' +
            escapeHtml(query) +
            '”. Try another search.</p>';
          return;
        }

        items.forEach(function (item) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "track";
          btn.dataset.key = (item.videoId || item.browseId || item.title) + "";

          const thumbUrl = item.thumbnail && item.thumbnail.url;
          const thumb = thumbUrl
            ? '<img src="' + escapeHtml(thumbUrl) + '" alt="" loading="lazy" />'
            : '<div class="track-thumb-placeholder"><i class="fa-solid fa-music"></i></div>';

          const meta =
            item.artist ||
            (item.artists && item.artists.join(", ")) ||
            item.author ||
            item.type ||
            "";

          const dur = item.duration && item.duration.label ? item.duration.label : "";

          btn.innerHTML =
            thumb +
            '<div class="track-info">' +
            '<div class="track-title">' +
            escapeHtml(item.title || "Untitled") +
            "</div>" +
            '<div class="track-meta">' +
            escapeHtml(meta) +
            "</div></div>" +
            (dur ? '<span class="track-duration">' + escapeHtml(dur) + "</span>" : "") +
            (playableItem(item)
              ? '<span class="track-play"><i class="fa-solid fa-play"></i></span>'
              : '<span class="track-play"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>');

          btn.addEventListener("click", function () {
            if (playableItem(item) && item.videoId) {
              playTrack(item, btn);
            } else if (item.browseId) {
              showError(
                "This is a " +
                  item.type +
                  ". Open API docs to fetch details by browseId, or search for songs instead."
              );
            } else {
              showError("This item cannot be played (no video ID).");
            }
          });

          el.results.appendChild(btn);
        });
      }

      async function runSearch(q, fromSuggestion) {
        hideError();
        hideSuggestions();
        const type = el.type.value;
        const query = q.trim();
        if (!query) {
          showError("Enter a search term.");
          return;
        }

        el.searchBtn.disabled = true;
        setStatus("Searching…", true);

        try {
          const data = await API.search(query, type);
          const items = Array.isArray(data.items) ? data.items : [];
          setQueueFromItems(items);
          setStatus(items.length + " result" + (items.length === 1 ? "" : "s") + " · " + type);
          renderResults(items, query);
          if (!fromSuggestion && type === "song" && !items.length) {
            showError("No songs found. Try different keywords or switch result type.");
          }
        } catch (err) {
          setStatus("");
          el.results.innerHTML = "";
          showError(err.message || "Search failed.");
        } finally {
          el.searchBtn.disabled = false;
        }
      }

      function updatePlayerMeta(item) {
        el.playerTitle.textContent = item.title || "Untitled";
        el.playerArtist.textContent =
          item.artist || (item.artists && item.artists.join(", ")) || "Unknown artist";

        var thumbUrl = item.thumbnail && item.thumbnail.url;
        if (thumbUrl) {
          el.playerThumb.src = thumbUrl;
          el.playerThumb.hidden = false;
          el.playerArtPlaceholder.hidden = true;
        } else {
          el.playerThumb.hidden = true;
          el.playerArtPlaceholder.hidden = false;
        }

        if (item.duration && item.duration.label) {
          el.timeTotal.textContent = item.duration.label;
        }
      }

      function playTrack(item, trackEl) {
        hideError();
        el.playerError.classList.remove("visible");
        el.playerError.textContent = "";

        if (!item.videoId) {
          showError("Cannot play this track: missing video ID.");
          return;
        }

        var idx = queue.findIndex(function (q) {
          return q.videoId === item.videoId;
        });
        if (idx >= 0) queueIndex = idx;
        else {
          queue.push(item);
          queueIndex = queue.length - 1;
        }

        highlightQueueTrack(item.videoId);

        activeTrackKey = item.videoId;
        currentWatchUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(item.videoId);
        updatePlayerMeta(item);
        updateQueueButtons();

        el.btnPlay.disabled = true;
        el.playerDock.classList.add("open");
        document.body.classList.add("player-open");

        ensureYtPlayer()
          .then(function (player) {
            el.btnPlay.disabled = false;
            player.loadVideoById(item.videoId);
            setPlayIcon(true);
            startProgressTimer();
          })
          .catch(function () {
            showError("Could not initialize the audio player.");
            el.btnPlay.disabled = false;
          });
      }

      function togglePlayPause() {
        if (!ytPlayer || !ytReady) return;
        var state = ytPlayer.getPlayerState();
        if (state === YT_STATE.PLAYING) {
          ytPlayer.pauseVideo();
        } else {
          ytPlayer.playVideo();
        }
      }

      function playAtIndex(index) {
        if (index < 0 || index >= queue.length) return;
        queueIndex = index;
        playTrack(queue[index], null);
      }

      function playNext(fromEnded) {
        if (queueIndex < queue.length - 1) {
          playAtIndex(queueIndex + 1);
        } else if (fromEnded) {
          setPlayIcon(false);
          stopProgressTimer();
        }
      }

      function playPrev() {
        if (queueIndex > 0) playAtIndex(queueIndex - 1);
      }

      function closePlayer() {
        stopProgressTimer();
        if (ytPlayer && ytReady) {
          try {
            ytPlayer.stopVideo();
          } catch (_) {}
        }
        el.playerDock.classList.remove("open");
        document.body.classList.remove("player-open");
        highlightQueueTrack(null);
        activeTrackKey = null;
        setPlayIcon(false);
        el.progressFill.style.width = "0%";
        el.progressSeek.value = "0";
        el.timeCurrent.textContent = "0:00";
      }

      function hideSuggestions() {
        el.suggestions.classList.remove("visible");
        el.suggestions.innerHTML = "";
      }

      async function loadSuggestions(q) {
        if (q.length < 2) {
          hideSuggestions();
          return;
        }
        try {
          const data = await API.suggestions(q);
          const list = Array.isArray(data.suggestions) ? data.suggestions : [];
          if (!list.length) {
            hideSuggestions();
            return;
          }
          el.suggestions.innerHTML = "";
          list.slice(0, 8).forEach(function (s) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = s;
            b.addEventListener("click", function () {
              el.query.value = s;
              runSearch(s, true);
            });
            el.suggestions.appendChild(b);
          });
          el.suggestions.classList.add("visible");
        } catch {
          hideSuggestions();
        }
      }

      el.form.addEventListener("submit", function (e) {
        e.preventDefault();
        runSearch(el.query.value, false);
      });

      el.query.addEventListener("input", function () {
        clearTimeout(suggestTimer);
        const q = el.query.value.trim();
        suggestTimer = setTimeout(function () {
          loadSuggestions(q);
        }, 320);
      });

      el.query.addEventListener("blur", function () {
        setTimeout(hideSuggestions, 180);
      });

      el.alertClose.addEventListener("click", hideError);
      el.playerClose.addEventListener("click", closePlayer);
      el.btnPlay.addEventListener("click", togglePlayPause);
      el.btnPrev.addEventListener("click", playPrev);
      el.btnNext.addEventListener("click", function () {
        playNext(false);
      });

      el.volume.addEventListener("input", function () {
        if (ytPlayer && ytReady) ytPlayer.setVolume(Number(el.volume.value));
      });

      el.progressSeek.addEventListener("mousedown", function () {
        isSeeking = true;
      });
      el.progressSeek.addEventListener("touchstart", function () {
        isSeeking = true;
      });

      function commitSeek() {
        if (!ytPlayer || !ytReady) return;
        var dur = ytPlayer.getDuration();
        if (!dur) return;
        var pct = Number(el.progressSeek.value) / 100;
        ytPlayer.seekTo(dur * pct, true);
        isSeeking = false;
        updateProgress();
      }

      el.progressSeek.addEventListener("change", commitSeek);
      el.progressSeek.addEventListener("mouseup", commitSeek);
      el.progressSeek.addEventListener("touchend", commitSeek);
      el.progressSeek.addEventListener("input", function () {
        if (!isSeeking) return;
        el.progressFill.style.width = el.progressSeek.value + "%";
      });

      window.addEventListener("unhandledrejection", function (ev) {
        showError(ev.reason && ev.reason.message ? ev.reason.message : "Something went wrong.");
      });

      setStatus("Try searching for “lofi” or “jazz”.");
    })();
  </script>
</body>
</html>
