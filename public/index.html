<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavebox — YouTube Music API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --bg-deep: #0a0e17;
      --accent: #00e5c7;
      --accent-dim: #00b39a;
      --text: #f0f4f8;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: var(--bg-deep);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 229, 199, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(99, 102, 241, 0.2), transparent),
        radial-gradient(ellipse 50% 30% at 0% 80%, rgba(236, 72, 153, 0.15), transparent),
        linear-gradient(180deg, #0f172a 0%, #0a0e17 50%, #050810 100%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(0, 229, 199, 0.15), rgba(99, 102, 241, 0.12));
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 60px rgba(0, 229, 199, 0.12);
    }

    .logo-wrap svg {
      width: 72px;
      height: 72px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #042f2e;
      box-shadow: 0 8px 24px rgba(0, 229, 199, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 229, 199, 0.45);
    }

    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      text-align: left;
    }

    .feature {
      padding: 1.25rem;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      transition: border-color 0.15s, transform 0.15s;
    }

    a.feature {
      text-decoration: none;
      color: inherit;
    }

    a.feature:hover {
      border-color: rgba(0, 229, 199, 0.4);
      transform: translateY(-3px);
    }

    .feature i {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
      display: block;
    }

    .feature strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .feature span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer i {
      color: var(--accent);
      margin-right: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="page">
    <div class="logo-wrap" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wavebox logo">
        <rect x="8" y="14" width="48" height="36" rx="8" stroke="#00e5c7" stroke-width="2.5" fill="rgba(0,229,199,0.08)"/>
        <path d="M14 38c6-8 12-8 18 0s12 8 18 0" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="32" cy="26" r="4" fill="#00e5c7"/>
        <path d="M28 8h8l2 6H26l2-6z" fill="#00e5c7" opacity="0.9"/>
      </svg>
    </div>

    <h1><span>Wavebox</span></h1>
    <p class="tagline">YouTube Music REST API — search, albums, artists, and playlists for your apps.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/api">
        <i class="fa-solid fa-book"></i> API docs
      </a>
      <a class="btn btn-ghost" href="/api/health">
        <i class="fa-solid fa-heart-pulse"></i> Health check
      </a>
    </div>

    <div class="features">
      <a class="feature" href="/api/search?q=lofi">
        <i class="fa-solid fa-magnifying-glass"></i>
        <strong>Search</strong>
        <span>/api/search</span>
      </a>
      <a class="feature" href="/api/suggestions?q=beat">
        <i class="fa-solid fa-lightbulb"></i>
        <strong>Suggestions</strong>
        <span>/api/suggestions</span>
      </a>
      <a class="feature" href="/api/health">
        <i class="fa-solid fa-signal"></i>
        <strong>Health</strong>
        <span>/api/health</span>
      </a>
      <a class="feature" href="/api">
        <i class="fa-brands fa-flutter"></i>
        <strong>Flutter</strong>
        <span>Client-ready</span>
      </a>
    </div>

    <footer>
      <i class="fa-solid fa-wave-square"></i>
      Deploy on Vercel · JSON under <code>/api</code>
    </footer>
  </main>
</body>
</html>
