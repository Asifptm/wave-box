# Full Wavebox with MP3 conversion (ffmpeg + yt-dlp)
# Usage:
#   docker compose up --build
#   open http://localhost:3000/

services:
  wavebox:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      WAVEBOX_CONVERSION: "1"
      # Optional: force absolute URLs in streamUrl/audioUrl (Railway/Render public URL)
      # PUBLIC_BASE_URL: "https://your-app.up.railway.app"
    volumes:
      - wavebox-audio:/app/tmp/audio
    restart: unless-stopped

volumes:
  wavebox-audio:
